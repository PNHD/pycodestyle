name: pre-commit issue 1241

on:
  push:
    branches: [ops/1241-precommit]

jobs:
  precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1241-nested-fstring-format
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pre-commit
      - run: pre-commit run --all-files
